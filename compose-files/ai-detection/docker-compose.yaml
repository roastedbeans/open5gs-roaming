services:
  ai-detection:
    # Use published image from Docker Hub (recommended)
    image: vinch05/open5gs-ai-detection:latest

    # Alternative: Build locally (uncomment to use instead of image)
    # build:
    #   context: ../../
    #   dockerfile: images/ai-detection/Dockerfile
    container_name: open5gs-ai-detection
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ../../ai-detection/performance_data:/app/performance_data
    networks:
      - open5gs
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    # Resource configuration based on performance testing
    # Peak usage: LSTM=360% CPU/291MB RAM, CNN=265% CPU/297MB RAM
    deploy:
      resources:
        limits:
          cpus: '2.0'      # 2 CPU core (handles LSTM peak usage of ~3.6 cores)
          memory: 2G     # 512MB RAM (handles all models comfortably, peak ~300MB)
        reservations:
          cpus: '1.0'      # Reserve 1 CPU core for guaranteed performance
          memory: 128M     # Reserve 128MB RAM for stable operation
    healthcheck:
      test: ["CMD", "python", "-c", "from handler import AIDetectionHandler; h = AIDetectionHandler(); print('healthy' if h.health_check().get('status') == 'healthy' else exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["--command", "server", "--host", "0.0.0.0", "--port", "8000"]

# =============================================================================
# ALTERNATIVE CONFIGURATIONS (Uncomment to use instead of minimal config above)
# =============================================================================

# STANDARD CONFIGURATION (4 CPU cores, 1GB RAM)
