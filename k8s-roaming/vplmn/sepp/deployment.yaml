apiVersion: apps/v1
kind: Deployment
metadata:
  name: sepp
  namespace: vplmn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sepp
  template:
    metadata:
      labels:
        app: sepp
    spec:
      containers:
        - name: sepp
          image: docker.io/vinch05/sepp:v2.7.5
          imagePullPolicy: IfNotPresent
          command: ['open5gs-seppd', '-c', '/etc/open5gs/sepp.yaml']
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs/sepp.yaml
              subPath: sepp.yaml
            - name: pcap-volume
              mountPath: /pcap
            - name: tls-n32c
              mountPath: /etc/open5gs/tls/n32c
              readOnly: true
            - name: tls-n32f
              mountPath: /etc/open5gs/tls/n32f
              readOnly: true
            - name: tls-ca
              mountPath: /etc/open5gs/tls/ca
              readOnly: true
          ports:
            - containerPort: 80
              name: sbi
            - containerPort: 7778
              name: n32c
              protocol: TCP
            - containerPort: 7779
              name: n32f
              protocol: TCP
        - name: sniffer
          image: corfr/tcpdump
          imagePullPolicy: IfNotPresent
          command: ['/bin/sh', '-c']
          args: ['tcpdump -i any -w /pcap/sepp.pcap']
          securityContext:
            privileged: true
          resources:
            requests:
              ephemeral-storage: '1Gi'
            limits:
              ephemeral-storage: '5Gi'
          volumeMounts:
            - name: pcap-volume
              mountPath: /pcap
        - name: cicflowmeter
          image: docker.io/vinch05/cicflowmeter:latest
          imagePullPolicy: Always
          command: ['/bin/bash', '-c']
          args: ['source /etc/cicflowmeter/cicflowmeter-config.sh && while true; do if [ -f /pcap/test_dos.pcap ]; then echo "PCAP file found at $(date), size: $(du -h /pcap/test_dos.pcap | cut -f1)"; if [ ! -f /pcap/test_dos.csv ] || [ /pcap/test_dos.pcap -nt /pcap/test_dos.csv ]; then echo "Converting PCAP to CSV..." && /app/.venv/bin/cicflowmeter -f /pcap/test_dos.pcap -c /pcap/test_dos.csv --fields $CICFLOWMETER_FIELDS && echo "CSV conversion completed at $(date)"; else echo "CSV already up-to-date, checking again in 1 minute"; fi; else echo "Waiting for PCAP file..."; fi; sleep 60; done']
          resources:
            requests:
              ephemeral-storage: '1Gi'
            limits:
              ephemeral-storage: '5Gi'
          volumeMounts:
            - name: pcap-volume
              mountPath: /pcap
            - name: cicflowmeter-config
              mountPath: /etc/cicflowmeter
      volumes:
        - name: config
          configMap:
            name: sepp-config
        - name: tls-n32c
          secret:
            secretName: sepp-n32c
        - name: tls-n32f
          secret:
            secretName: sepp-n32f
        - name: tls-ca
          secret:
            secretName: sepp-ca
        - name: pcap-volume
          emptyDir: {}
        - name: cicflowmeter-config
          configMap:
            name: cicflowmeter-config
