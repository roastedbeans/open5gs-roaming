apiVersion: v1
kind: Service
metadata:
  name: ai-detection
  namespace: vplmn
  labels:
    app: ai-detection
spec:
  type: ClusterIP
  selector:
    app: ai-detection
  ports:
    - name: api
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# Optional: NodePort service for external access during development/testing
apiVersion: v1
kind: Service
metadata:
  name: ai-detection-nodeport
  namespace: vplmn
  labels:
    app: ai-detection
spec:
  type: NodePort
  selector:
    app: ai-detection
  ports:
    - name: api
      port: 8000
      targetPort: 8000
      protocol: TCP
      nodePort: 32000
